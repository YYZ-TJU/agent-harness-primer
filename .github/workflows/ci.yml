name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  examples:
    name: 示例能跑 (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 逐个跑示例
        run: |
          set -e
          for f in examples/*/*.py; do
            case "$f" in
              */__init__.py|*/fake_llm.py) continue ;;
            esac
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  docs:
    name: 文档自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查链接、编号、结构
        run: python scripts/check_docs.py
