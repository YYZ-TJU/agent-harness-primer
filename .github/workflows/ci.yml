name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 新推送取消排队中的旧 run，避免堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 示例 + 文档 (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑示例
        run: |
          set -e
          for f in examples/*/*.py; do
            case "$f" in
              */__init__.py|*/fake_llm.py) continue ;;
            esac
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: 文档自检
        run: python scripts/check_docs.py
