name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 新的推送取消排队中的旧运行——避免一直卡在队列里
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 示例 + 文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑示例
        run: |
          set -e
          for f in examples/*/*.py; do
            case "$f" in
              */__init__.py|*/fake_llm.py) continue ;;
            esac
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: 文档自检
        run: python scripts/check_docs.py
